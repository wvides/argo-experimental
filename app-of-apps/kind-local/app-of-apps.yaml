apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-management
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: infra
  source:
    path: environments/kind-local
    repoURL: https://github.com/wvides/argo-experimental.git
    targetRevision: HEAD
    directory:
      recurse: false
  syncPolicy:
    automated:
      selfHeal: true
